<div class="sidenav">
  <!-- Movies Section -->
  <div class="nav-section">
    <h3 class="nav-header">
      <mat-icon>movie</mat-icon>
      Movies
    </h3>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>All Movies</span>
      </a>
      @for (genre of movieGenres(); track genre.id) {
        <a mat-list-item [routerLink]="['/']" [queryParams]="{genre: genre.name, type: 'movie'}">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>{{ genre.name }}</span>
        </a>
      }
    </mat-nav-list>
  </div>

  <!-- Games Section -->
  <div class="nav-section">
    <h3 class="nav-header">
      <mat-icon>sports_esports</mat-icon>
      Games
    </h3>
    <mat-nav-list>
      @for (genre of gameGenres(); track genre.id) {
        <a mat-list-item [routerLink]="['/']" [queryParams]="{genre: genre.name, type: 'game'}">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>{{ genre.name }}</span>
        </a>
      }
    </mat-nav-list>
  </div>

  <!-- User Section -->
  @if (authService.isAuthenticated()) {
    <div class="nav-section">
      <h3 class="nav-header">
        <mat-icon>person</mat-icon>
        My Account
      </h3>
      <mat-nav-list>
        <a mat-list-item routerLink="/favorites">
          <mat-icon matListItemIcon>favorite</mat-icon>
          <span matListItemTitle>My Favorites</span>
        </a>
      </mat-nav-list>
    </div>
  }
</div>
