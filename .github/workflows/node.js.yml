# Builds the app and runs unit tests on every push/PR to main.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Angular 19 accepts ^18.19.1 || ^20.11.1 || ^22.0.0.
        # 22.x matches the version pinned in package.json engines.
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ci installs from the lockfile, so builds are reproducible.
      - run: npm ci

      # The build injects API keys via scripts/replace-env.js. Without secrets
      # configured the placeholders remain, which still compiles - this job
      # verifies the code builds, it does not produce a deployable artifact.
      - name: Build
        run: npm run build
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # `npm test` runs Karma in watch mode, which never exits on CI.
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
