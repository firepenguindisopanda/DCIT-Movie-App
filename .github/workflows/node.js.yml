# Builds the app and runs unit tests on every push/PR to main.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # The API keys are stored as *environment* secrets on "dcit-movie-app".
    # Without this line they resolve to empty strings and the build silently
    # ships placeholder keys.
    environment: dcit-movie-app

    strategy:
      matrix:
        # Angular 20 accepts ^20.19.0 || ^22.12.0 || ^24.0.0.
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ci installs from the lockfile, so builds are reproducible.
      - run: npm ci

      # scripts/replace-env.js generates the gitignored environment files from
      # environment.example.ts and injects these values.
      - name: Build
        run: npm run build
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Vitest runs once and exits by default, so plain `npm test` is correct.
      - name: Unit tests
        run: npm test
